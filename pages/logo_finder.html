<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Finder — WebTools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="bg-white min-h-screen flex flex-col items-center justify-center p-6">
  <nav class="w-full max-w-lg text-xs text-gray-400 mb-4">
    <a href="../index.html" class="text-gray-600 hover:text-gray-900">WebTools</a>
    <span class="mx-1">/</span>
    <span class="text-gray-900">Logo Finder</span>
  </nav>

  <div class="bg-white border border-gray-200 rounded-xl p-8 w-full max-w-lg"
       x-data="{
         query: '',
         logo: null,
         error: false,
         sanitize(value) {
           return value.trim().toLowerCase()
             .replace(/^https?:\/\//, '')
             .replace(/^www\./, '')
             .split(/[/?#]/)[0]
         },
         fetch() {
           const domain = this.sanitize(this.query)
           if (!domain) return
           this.query = domain.includes('.') ? domain : domain + '.com'
           this.logo = null
           this.error = false
           const img = new Image()
           img.onload = () => { this.logo = img.src }
           img.onerror = () => { this.error = true }
           img.src = 'https://logos.hunter.io/' + this.query
         },
         download() {
           const a = document.createElement('a')
           a.href = this.logo
           a.download = 'logo-' + this.query + '.png'
           a.click()
         }
       }">
    <h1 class="text-base font-semibold text-gray-900 mb-6">Logo Finder</h1>

    <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1">Domain</label>
    <div class="flex gap-2">
      <input type="text" x-model="query" @keydown.enter="fetch()" placeholder="apple.com"
             class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gray-400">
      <button @click="fetch()"
              class="border border-gray-200 rounded-lg px-4 py-2 text-sm text-gray-600 hover:border-gray-400 transition-colors">
        Fetch
      </button>
    </div>

    <div x-show="logo" class="mt-6 border border-gray-200 rounded-lg p-6 flex items-center justify-center min-h-32">
      <img :src="logo" :alt="query + ' logo'" class="max-h-24 object-contain">
    </div>

    <button x-show="logo" @click="download()"
            class="mt-3 w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-600 hover:border-gray-400 transition-colors">
      Download
    </button>

    <p x-show="error" class="mt-4 text-xs text-gray-400 text-center">No logo found for that domain.</p>
  </div>
</body>
</html>
