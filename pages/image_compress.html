<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Compress — WebTools</title>
  <script src="../shared/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="scripts/image_compress.js"></script>
</head>
<body class="bg-white min-h-screen flex flex-col items-center p-6 pt-16">
  <nav class="w-full max-w-page text-xs text-gray-400 mb-4">
    <a href="../index.html" class="text-gray-600 hover:text-gray-900">WebTools</a>
    <span class="mx-1">/</span>
    <span class="text-gray-900">Image Compress</span>
  </nav>

  <div class="bg-white border border-gray-200 rounded-xl p-8 w-full max-w-page" x-data="imageCompress()">
    <h1 class="text-base font-semibold text-gray-900 mb-6">Image Compress</h1>

    <!-- Upload zone -->
    <div @dragover.prevent @drop.prevent="onDrop($event)" @click="$refs.fileInput.click()"
         class="border-2 border-dashed border-gray-200 rounded-lg p-8 text-center text-sm text-gray-400 cursor-pointer hover:border-gray-400 transition-colors mb-4">
      Drop image here or <span class="underline">click to upload</span>
      <input type="file" accept="image/*" x-ref="fileInput" @change="onFile($event)" class="hidden">
    </div>

    <!-- Previews -->
    <div x-show="original" class="grid grid-cols-2 gap-3 mb-4">
      <div class="border border-gray-200 rounded-lg overflow-hidden">
        <div class="bg-gray-50 px-3 py-1.5 text-xs text-gray-400 border-b border-gray-200">Original</div>
        <img :src="original" class="w-full object-contain">
        <div class="bg-gray-50 px-3 py-1.5 text-xs text-gray-400 border-t border-gray-200">
          <div x-text="(originalSize / 1048576).toFixed(2) + ' MB'"></div>
          <div x-text="originalDims"></div>
        </div>
      </div>
      <div class="border border-gray-200 rounded-lg overflow-hidden">
        <div class="bg-gray-50 px-3 py-1.5 text-xs text-gray-400 border-b border-gray-200">Compressed</div>
        <img :src="compressed" class="w-full object-contain">
        <div class="bg-gray-50 px-3 py-1.5 text-xs border-t border-gray-200" :class="compressedSmaller ? 'text-green-700' : 'text-gray-400'">
          <div x-text="(compressedSize / 1048576).toFixed(2) + ' MB'"></div>
          <div x-text="compressedDims"></div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div x-show="original" class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1">Format</label>
          <select x-model="format" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gray-400">
            <option value="jpeg">JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
          </select>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1">Max size (MB)</label>
          <input type="number" x-model.number="maxMB" min="0.1" step="0.1"
                 class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gray-400">
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs uppercase tracking-widest text-gray-400">Quality</label>
          <div class="flex items-center gap-1">
            <input type="number" x-model.number="quality" min="1" max="100"
                   class="w-14 bg-gray-50 border border-gray-200 rounded px-2 py-0.5 text-xs text-right focus:outline-none focus:border-gray-400">
            <span class="text-xs text-gray-400">%</span>
          </div>
        </div>
        <input type="range" x-model.number="quality" min="1" max="100" class="w-full accent-gray-600">
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs uppercase tracking-widest text-gray-400">Scale</label>
          <div class="flex items-center gap-1">
            <input type="number" x-model.number="scale" min="1" max="100"
                   class="w-14 bg-gray-50 border border-gray-200 rounded px-2 py-0.5 text-xs text-right focus:outline-none focus:border-gray-400">
            <span class="text-xs text-gray-400">%</span>
          </div>
        </div>
        <input type="range" x-model.number="scale" min="1" max="100" class="w-full accent-gray-600">
      </div>

      <!-- Download -->
      <button @click="download()"
              class="w-full bg-green-700 text-white rounded-lg px-3 py-2 text-sm font-medium hover:bg-green-800 transition-colors">
        Download compressed image
      </button>

      <!-- Base64 panel -->
      <div class="border border-gray-200 rounded-lg overflow-hidden">
        <div class="bg-gray-50 px-3 py-2 flex justify-between items-center border-b border-gray-200">
          <div class="flex items-center gap-3">
            <span class="text-xs uppercase tracking-widest text-gray-400">Base64</span>
            <span class="text-xs text-gray-400" x-text="base64Bytes"></span>
          </div>
          <button @click="copyBase64()"
                  class="border border-gray-200 rounded px-2 py-0.5 text-xs text-gray-500 hover:border-gray-400">Copy</button>
        </div>
        <textarea :value="compressed" readonly rows="3"
                  class="w-full bg-white px-3 py-2 text-xs font-mono text-gray-400 resize-none focus:outline-none"></textarea>
      </div>
    </div>
  </div>
</body>
</html>
